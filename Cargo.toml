[package]
name = "nserver"
version = "0.3.0"
edition = "2024"
description = "NSERVER: a terminal server management panel for nginx, Docker, files, FTP, SSL and monitoring"
license = "MIT"
readme = "README.md"
keywords = ["nginx", "tui", "ratatui", "admin"]
categories = ["command-line-utilities"]
rust-version = "1.98"


[dependencies]
anyhow = "1"
chrono = "0.4"
crossterm = "0.28"
glob = "0.3"
libc = "0.2"
ratatui = "0.29"
tui-textarea = "0.7"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
