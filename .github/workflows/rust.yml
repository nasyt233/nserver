name: Release NSERVER

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: nserver-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Read version and validate tag
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read Cargo.toml version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not read package.version from Cargo.toml."
            exit 1
          fi
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::Tag '$TAG' does not match Cargo.toml version 'v$VERSION'."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing NSERVER $VERSION from tag $TAG"

  test:
    name: Format, lint and test
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

  build:
    name: Build ${{ matrix.arch }}
    needs: [prepare, test]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------- glibc ----------
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            linker_env: ""
            apt_packages: ""
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            linker_env: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            apt_packages: gcc-aarch64-linux-gnu

          # ---------- musl 静态链接 ----------
          - target: x86_64-unknown-linux-musl
            arch: amd64-musl
            linker_env: CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
            apt_packages: musl-tools
          - target: aarch64-unknown-linux-musl
            arch: arm64-musl
            linker_env: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-musl-gcc
            apt_packages: musl-tools gcc-aarch64-linux-gnu
          - target: armv7-unknown-linux-musleabihf
            arch: armv7-musl
            linker_env: CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER=arm-linux-musleabihf-gcc
            apt_packages: musl-tools gcc-arm-linux-gnueabihf

          # ---------- 可选：riscv64（需要额外 musl 交叉工具链） ----------
          # - target: riscv64gc-unknown-linux-musl
          #   arch: riscv64-musl
          #   linker_env: CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_MUSL_LINKER=riscv64-linux-musl-gcc
          #   apt_packages: musl-tools

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross toolchain
        if: matrix.apt_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Install musl cross compiler for aarch64/armv7
        if: contains(matrix.target, 'musl') && (matrix.arch == 'arm64-musl' || matrix.arch == 'armv7-musl')
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.arch }}" == "arm64-musl" ]]; then
            wget -q https://more.musl.cc/x86_64-linux-musl/aarch64-linux-musl-cross.tgz
            tar -xzf aarch64-linux-musl-cross.tgz -C /tmp
            sudo mv /tmp/aarch64-linux-musl-cross /opt/
            echo "/opt/aarch64-linux-musl-cross/bin" >> "$GITHUB_PATH"
          elif [[ "${{ matrix.arch }}" == "armv7-musl" ]]; then
            wget -q https://more.musl.cc/x86_64-linux-musl/arm-linux-musleabihf-cross.tgz
            tar -xzf arm-linux-musleabihf-cross.tgz -C /tmp
            sudo mv /tmp/arm-linux-musleabihf-cross /opt/
            echo "/opt/arm-linux-musleabihf-cross/bin" >> "$GITHUB_PATH"
          fi

      - name: Build release binary
        env:
          ${{ matrix.linker_env }}
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Package asset
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          ASSET="nserver-${VERSION}-${{ matrix.arch }}"
          cp "target/${{ matrix.target }}/release/nserver" "$ASSET"
          chmod +x "$ASSET"
          file "$ASSET"
          ls -lh "$ASSET"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: nserver-${{ matrix.arch }}
          path: nserver-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          pattern: nserver-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ls -l
          sha256sum nserver-*-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: nserver v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/nserver-*
            dist/SHA256SUMS