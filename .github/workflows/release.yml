name: Build and Release

on:
  push:
    tags:
      - 'nserver-*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            target_name: linux-amd64
            bin_name: nserver
            ext: ''
            use_zig: true
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            target_name: linux-arm64
            bin_name: nserver
            ext: ''
            use_zig: true
          - os: ubuntu-22.04
            target: armv7-unknown-linux-musleabihf
            target_name: linux-armv7
            bin_name: nserver
            ext: ''
            use_zig: true
          - os: ubuntu-22.04
            target: i686-unknown-linux-musl
            target_name: linux-i686
            bin_name: nserver
            ext: ''
            use_zig: true
          - os: ubuntu-22.04
            target: riscv64gc-unknown-linux-musl
            target_name: linux-riscv64
            bin_name: nserver
            ext: ''
            use_zig: true
          - os: ubuntu-22.04
            target: powerpc64le-unknown-linux-musl
            target_name: linux-ppc64le
            bin_name: nserver
            ext: ''
            use_zig: true
          - os: macos-latest
            target: x86_64-apple-darwin
            target_name: macos-amd64
            bin_name: nserver
            ext: ''
            use_zig: false
          - os: macos-latest
            target: aarch64-apple-darwin
            target_name: macos-arm64
            bin_name: nserver
            ext: ''
            use_zig: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        if: matrix.use_zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: matrix.use_zig
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Get package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(awk -F'"' '/^version[[:space:]]*=/{print $2; exit}' Cargo.toml)
          if [ -z "$VERSION" ]; then
            echo "无法读取版本号"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/nserver-}"
          VERSION="${{ steps.version.outputs.version }}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag (nserver-$TAG) 与 Cargo.toml 版本 ($VERSION) 不一致"
            exit 1
          fi

      - name: Build (musl via zig)
        if: matrix.use_zig
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Build (native)
        if: '!matrix.use_zig'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          SRC="target/${{ matrix.target }}/release/${{ matrix.bin_name }}${{ matrix.ext }}"
          [ -f "$SRC" ] || SRC="target/release/${{ matrix.bin_name }}${{ matrix.ext }}"
          DST="dist/nserver-${{ steps.version.outputs.version }}-${{ matrix.target_name }}${{ matrix.ext }}"
          cp "$SRC" "$DST"
          chmod +x "$DST"
          file "$DST" || true
          ls -lh "$DST"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nserver-${{ matrix.target_name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -laR artifacts/
      - name: Generate checksums
        run: sha256sum artifacts/nserver-* > artifacts/SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
